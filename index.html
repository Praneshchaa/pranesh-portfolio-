<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pranesh Shrestha</title>
<meta name="description" content="Pranesh Shrestha — UI/UX &amp; product designer, and videographer, video editor, graphic designer &amp; marketer, based in Kathmandu, Nepal.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
--bg:#121316;--ink:#f2f0eb;--dim:#a9adb5;--meta:#9297a1;--line:rgba(255,255,255,.11);
--acc:#8b6bf2;--accInk:#1f1730;--accText:#8b6bf2;--panel:#181a1e;
--font:Archivo,system-ui,sans-serif;--mono:'Space Grotesk',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
background:var(--bg);font-family:var(--font);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:24px;overflow-x:clip;
}
.wrap{max-width:720px;width:100%;text-align:center;animation:rise .7s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{font:600 12px/1.6 var(--mono);color:var(--accText);letter-spacing:.14em;margin-bottom:18px}
h1{margin:0 0 42px;font:500 clamp(28px,5vw,44px)/1.25 var(--font);letter-spacing:-.02em;color:var(--ink)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.options{grid-template-columns:1fr}}
.opt{
display:flex;flex-direction:column;justify-content:space-between;gap:16px;
border:1px solid var(--line);border-radius:10px;background:var(--panel);
padding:30px 26px;text-decoration:none;color:var(--ink);text-align:left;
transition:border-color .2s,transform .2s,background .2s;min-height:150px;
}
.opt:hover{border-color:var(--acc);transform:translateY(-3px);background:#1c1e24}
.opt .label{font:500 19px/1.35 var(--font);letter-spacing:-.01em}
.opt .arrow{font:400 13px/1 var(--mono);color:var(--accText);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.name{margin-top:48px;font:400 12.5px/1.6 var(--mono);color:var(--meta)}
</style>
</head>
<body>
<div class="wrap">
<div class="eyebrow">PRANESH SHRESTHA</div>
<h1>I am here for</h1>
<div class="options">
<a class="opt" href="design.html">
<span class="label">UI/UX &amp; Product Designing</span>
<span class="arrow">ENTER <span>→</span></span>
</a>
<a class="opt" href="film.html">
<span class="label">Videography, Video Editing, Graphic Design &amp; Marketing</span>
<span class="arrow">ENTER <span>→</span></span>
</a>
</div>
<div class="name">KATHMANDU, NEPAL</div>
</div>
</body>
</html>
